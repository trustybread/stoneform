name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Apple Silicon, like every Mac StoneForm runs on.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Signs the app the way a release does, with a throwaway certificate, so
      # signing problems show up here rather than in the release job.
      - name: Bundle and sign
        run: |
          cert="$(mktemp -d)"
          CERT_NAME="StoneForm CI" scripts/make-signing-cert.sh "$cert"
          SIGNING_CERTIFICATE="$(base64 -i "$cert/stoneform-signing.p12")" \
          SIGNING_CERTIFICATE_PASSWORD="$(cat "$cert/stoneform-signing-password.txt")" \
            scripts/bundle.sh
          rm -rf "$cert"
